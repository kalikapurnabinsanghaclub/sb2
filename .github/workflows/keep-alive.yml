name: 24/7 Cloud Database Keep-Alive (Never Sleep)

on:
  schedule:
    # Runs every 3 days at 04:00 AM UTC (09:30 AM IST)
    - cron: '0 4 */3 * *'
  # Allows manual triggering from GitHub Actions web tab anytime
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping MongoDB Atlas & Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run 24/7 Keep-Alive Ping
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: "https://mmbtfbxxnprtzpzdklot.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_-WELjPDVV1Bnpee712Hn7Q_9MDwQmSA"
          MONGO_URI: "mongodb+srv://kalikapurnabinsanghaclub_db_user:Sb%40210617@knsdc.ewmcdmb.mongodb.net/knsdc?appName=Knsdc"
