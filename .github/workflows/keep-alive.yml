name: 24/7 Cloud Database Keep-Alive (Never Sleep)

on:
  schedule:
    # Runs every 3 days at 04:00 AM UTC (09:30 AM IST)
    - cron: '0 4 */3 * *'
  # Allows manual triggering from GitHub Actions web tab anytime
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping MongoDB Atlas & Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instant Low-Bandwidth Supabase Ping (Never Sleep)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: sb_publishable_veI5vYBOXffm4FSPjobycA_95FiB6a5" -H "Authorization: Bearer sb_publishable_veI5vYBOXffm4FSPjobycA_95FiB6a5" "https://fjscpohgysbelzkrkrxm.supabase.co/rest/v1/sync_state?select=id&limit=1")
          echo "Supabase HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase ping successful! 7-day auto-pause countdown has been reset to 0."
          else
            echo "⚠️ Warning: Supabase returned status $STATUS"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Full Database Verification
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: "https://fjscpohgysbelzkrkrxm.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_veI5vYBOXffm4FSPjobycA_95FiB6a5"
          MONGO_URI: "mongodb+srv://kalikapurnabinsanghaclub_db_user:Sb%40210617@knsdc.ewmcdmb.mongodb.net/knsdc?appName=Knsdc"
