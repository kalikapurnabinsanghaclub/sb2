<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KNSDC — Food & Ride Partner Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #f59e0b;
    --green: #10b981;
    --blue: #3b82f6;
    --red: #ef4444;
    --fh: 'Inter', sans-serif;
    --fm: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--fh); background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; }
  
  .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
  .logo-row { display: flex; align-items: center; gap: 12px; }
  .logo-img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); }
  .title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }

  .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 800; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 14px; }
  .tab-btn.active { color: #fff; border-color: var(--primary); background: rgba(245,158,11,0.1); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media(min-width: 768px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  .section-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px; }
  .section-title { font-size: 16px; font-weight: 800; border-bottom: 1.5px dashed var(--border); padding-bottom: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

  .order-card { background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
  .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .order-id { font-family: var(--fm); font-weight: 700; color: var(--primary); }
  
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .badge-pending { background: rgba(245,158,11,0.15); color: var(--primary); border: 1px solid var(--primary); }
  .badge-active { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid var(--blue); }
  .badge-completed { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid var(--green); }

  .action-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; transition: transform 0.15s; margin-top: 10px; }
  .action-btn:active { transform: scale(0.97); }

  .input-field { width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; outline: none; margin-bottom: 10px; }
  .input-field:focus { border-color: var(--primary); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-row">
      <img src="logo.png" alt="KNSDC Logo" class="logo-img"/>
      <div>
        <h1 class="title">Partner Service Portal Hub</h1>
        <div style="font-size:11px; color:var(--text-muted);">Manage food deliveries and transport bookings</div>
      </div>
    </div>
    <div id="connection-status" style="font-size:12px; font-weight:bold; color:var(--green);">⚡ ONLINE</div>
  </div>

  <div class="tab-buttons">
    <button onclick="switchTab('food')" id="tab-food" class="tab-btn active">🍔 Food Delivery Partner</button>
    <button onclick="switchTab('ride')" id="tab-ride" class="tab-btn">🏍️ Rapido Driver Partner</button>
  </div>

  <!-- FOOD DELIVERY PARTNER SECTION -->
  <div id="food-delivery-panel" class="grid">
    <div class="section-card">
      <h2 class="section-title" style="color: var(--primary);">📥 New &amp; Pending Orders</h2>
      <div id="pending-food-orders">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No pending orders. Good job!</div>
      </div>
    </div>
    <div class="section-card">
      <h2 class="section-title" style="color: var(--green);">🍳 preparing &amp; Completed</h2>
      <div id="completed-food-orders">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No processed orders yet.</div>
      </div>
    </div>
  </div>

  <!-- TRANSPORT RIDE PARTNER SECTION -->
  <div id="transport-ride-panel" class="grid" style="display: none;">
    <div class="section-card">
      <h2 class="section-title" style="color: var(--blue);">🔍 Incoming Ride Requests</h2>
      <div id="incoming-ride-bookings">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No ride requests available.</div>
      </div>
    </div>
    <div class="section-card">
      <h2 class="section-title" style="color: var(--green);">🏁 Ongoing &amp; Arrived Rides</h2>
      <div id="completed-ride-bookings">
        <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No active rides assigned.</div>
      </div>
    </div>
  </div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/localSync-v4.js?v=2"></script>
<script>
window.syncEngine = new (window.LocalSync || LocalSync)();

let currentTab = 'food';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-food').classList.toggle('active', tab === 'food');
  document.getElementById('tab-ride').classList.toggle('active', tab === 'ride');
  document.getElementById('food-delivery-panel').style.display = tab === 'food' ? 'grid' : 'none';
  document.getElementById('transport-ride-panel').style.display = tab === 'ride' ? 'grid' : 'none';
  renderData();
}

window.syncEngine.subscribe(() => {
  renderData();
});

function renderData() {
  const state = window.syncEngine.getData() || {};
  const orders = state.foodOrders || [];
  const bookings = state.rideBookings || [];

  if (currentTab === 'food') {
    const pendingContainer = document.getElementById('pending-food-orders');
    const completedContainer = document.getElementById('completed-food-orders');

    const pending = orders.filter(o => o.status === 'pending');
    const completed = orders.filter(o => o.status === 'preparing' || o.status === 'delivered');

    if (pending.length === 0) {
      pendingContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No pending orders. Good job!</div>`;
    } else {
      pendingContainer.innerHTML = pending.map(o => `
        <div class="order-card">
          <div class="order-header">
            <span class="order-id">${o.id}</span>
            <span class="badge badge-pending">New Order</span>
          </div>
          <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">Seat/Lounge: ${o.location}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;"><strong>Customer:</strong> ${o.participantName} (${o.participantId})</div>
          <div style="font-size:12px; color:var(--text-muted);">
            <strong>Items:</strong> ${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}
          </div>
          <button onclick="updateFoodStatus('${o.id}', 'preparing')" class="action-btn" style="background:var(--blue); color:white;">🍳 Accept &amp; Start Preparing</button>
        </div>
      `).join('');
    }

    if (completed.length === 0) {
      completedContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No processed orders yet.</div>`;
    } else {
      completedContainer.innerHTML = completed.map(o => {
        const isPreparing = o.status === 'preparing';
        const actionHtml = isPreparing ? `
          <button onclick="updateFoodStatus('${o.id}', 'delivered')" class="action-btn" style="background:var(--green); color:white;">📦 Mark as Delivered</button>
        ` : `<div style="color:var(--green); font-size:12px; font-weight:bold; text-align:center; margin-top:10px;">✅ Delivered Successfully</div>`;

        return `
          <div class="order-card" style="border-color:${isPreparing ? 'var(--blue)' : 'var(--green)'};">
            <div class="order-header">
              <span class="order-id">${o.id}</span>
              <span class="badge badge-${o.status}">${o.status}</span>
            </div>
            <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">Seat/Lounge: ${o.location}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;"><strong>Customer:</strong> ${o.participantName}</div>
            <div style="font-size:12px; color:var(--text-muted);">
              <strong>Items:</strong> ${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}
            </div>
            ${actionHtml}
          </div>
        `;
      }).join('');
    }
  } else {
    // Ride logic
    const requestContainer = document.getElementById('incoming-ride-bookings');
    const assignedContainer = document.getElementById('completed-ride-bookings');

    const requests = bookings.filter(b => b.status === 'finding');
    const assigned = bookings.filter(b => b.status === 'assigned' || b.status === 'completed');

    if (requests.length === 0) {
      requestContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No ride requests available.</div>`;
    } else {
      requestContainer.innerHTML = requests.map(b => `
        <div class="order-card">
          <div class="order-header">
            <span class="order-id">${b.id}</span>
            <span class="badge badge-pending">Finding Partner</span>
          </div>
          <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">📍 From ${b.pickup} ➔ To ${b.drop}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;"><strong>Rider:</strong> ${b.participantName} | <strong>Fare:</strong> ₹${b.fare} (${b.vehicle})</div>
          
          <div style="display:flex; flex-direction:column; gap:8px;">
            <input type="text" id="driver-name-${b.id}" class="input-field" placeholder="Driver Name (e.g. Raju)">
            <input type="text" id="driver-phone-${b.id}" class="input-field" placeholder="Driver Phone Number">
            <button onclick="acceptRideBooking('${b.id}')" class="action-btn" style="background:var(--blue); color:white; margin-top:0;">🏍️ Accept Booking &amp; Assign</button>
          </div>
        </div>
      `).join('');
    }

    if (assigned.length === 0) {
      assignedContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No active rides assigned.</div>`;
    } else {
      assignedContainer.innerHTML = assigned.map(b => {
        const isAssigned = b.status === 'assigned';
        const actionHtml = isAssigned ? `
          <button onclick="updateRideStatus('${b.id}', 'completed')" class="action-btn" style="background:var(--green); color:white;">🏁 Mark as Arrived / Completed</button>
        ` : `<div style="color:var(--green); font-size:12px; font-weight:bold; text-align:center; margin-top:10px;">✅ Trip Completed</div>`;

        return `
          <div class="order-card" style="border-color:${isAssigned ? 'var(--blue)' : 'var(--green)'};">
            <div class="order-header">
              <span class="order-id">${b.id}</span>
              <span class="badge badge-${b.status}">${b.status}</span>
            </div>
            <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">📍 From ${b.pickup} ➔ To ${b.drop}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;"><strong>Rider:</strong> ${b.participantName} (${b.participantPhone})</div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;"><strong>Vehicle:</strong> ${b.vehicle.toUpperCase()} | <strong>Fare:</strong> ₹${b.fare}</div>
            <div style="font-size:12px; color:var(--green); font-weight:bold;">🏍️ Driver: ${b.driverName} (${b.driverPhone})</div>
            ${actionHtml}
          </div>
        `;
      }).join('');
    }
  }
}

async function updateFoodStatus(orderId, newStatus) {
  window.syncEngine.setData(s => {
    const orders = s.foodOrders || [];
    const idx = orders.findIndex(o => String(o.id) === String(orderId));
    if (idx !== -1) {
      orders[idx].status = newStatus;
    }
    return { ...s, foodOrders: orders };
  });
  await window.syncEngine.forceSaveStateToSupabase();
}

async function acceptRideBooking(bookingId) {
  const driverName = document.getElementById(`driver-name-${bookingId}`).value.trim();
  const driverPhone = document.getElementById(`driver-phone-${bookingId}`).value.trim();
  if (!driverName || !driverPhone) {
    alert('Please enter Driver Name & Phone Number.');
    return;
  }

  window.syncEngine.setData(s => {
    const bookings = s.rideBookings || [];
    const idx = bookings.findIndex(b => String(b.id) === String(bookingId));
    if (idx !== -1) {
      bookings[idx].status = 'assigned';
      bookings[idx].driverName = driverName;
      bookings[idx].driverPhone = driverPhone;
    }
    return { ...s, rideBookings: bookings };
  });
  await window.syncEngine.forceSaveStateToSupabase();
}

async function updateRideStatus(bookingId, newStatus) {
  window.syncEngine.setData(s => {
    const bookings = s.rideBookings || [];
    const idx = bookings.findIndex(b => String(b.id) === String(bookingId));
    if (idx !== -1) {
      bookings[idx].status = newStatus;
    }
    return { ...s, rideBookings: bookings };
  });
  await window.syncEngine.forceSaveStateToSupabase();
}
</script>
</body>
</html>
