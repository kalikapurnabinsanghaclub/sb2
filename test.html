<html>
<head>
<style>
    /* 3D Book Styles */
    .book-container {
      perspective: 1500px;
      width: 100%;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px 0;
      background: #ccc;
    }
    .book {
      position: relative;
      width: 300px;
      height: 400px;
      transform-style: preserve-3d;
      transform: translateX(150px);
      background: red; /* to see if it renders */
    }
    .book-page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.5s ease-in-out;
      border-radius: 4px 12px 12px 4px;
      box-shadow: inset 4px 0 10px rgba(0,0,0,0.1), 2px 2px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .book-page.flipped {
      transform: rotateY(-180deg);
    }
    .page-front, .page-back {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
    }
    .page-front {
      border-radius: 4px 12px 12px 4px;
    }
    .page-back {
      transform: rotateY(180deg);
      border-radius: 12px 4px 4px 12px;
      box-shadow: inset -4px 0 10px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>
  <div class="book-container">
    <div class="book" id="autoFlipBook">
      <div class="book-page" style="z-index: 2;">
        <div class="page-front" style="background: blue;">Front 1</div>
        <div class="page-back" style="background: green;">Back 1</div>
      </div>
      <div class="book-page" style="z-index: 1;">
        <div class="page-front" style="background: yellow;">Front 2</div>
        <div class="page-back" style="background: orange;">Back 2</div>
      </div>
    </div>
  </div>
  <button onclick="document.querySelector('.book-page').classList.toggle('flipped')">Flip</button>
</body>
</html>
