<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    window.addEventListener('error', function(e) {
      console.error('Portal Runtime Error:', e);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Finance Portal ("Finans Portal") - Supabase Authorized</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialStaffUsers = [
      {
        id: 'staff-1',
        name: 'David Miller',
        email: 'finance@club.org',
        role: 'Finance',
        department: 'Treasury & Accounts',
        supabaseStatus: 'Authorized in Supabase',
        status: 'Active',
        lastLogin: 'Just now'
      },
      {
        id: 'staff-2',
        name: 'Sarah Jenkins',
        email: 'admin@club.org',
        role: 'Admin',
        department: 'Executive Management',
        supabaseStatus: 'Authorized in Supabase',
        status: 'Active',
        lastLogin: '2 hours ago'
      },
      {
        id: 'staff-3',
        name: 'James Wilson',
        email: 'staff@club.org',
        role: 'Staff',
        department: 'Reception & Desk',
        supabaseStatus: 'Authorized in Supabase',
        status: 'Active',
        lastLogin: 'Yesterday'
      }
    ];

    const initialSettings = {
      clubName: 'Kalikapur Nabin Sangha (KNSDC)',
      tagline: 'Sports, Culture & Community Club Finance Portal',
      currencySymbol: '₹',
      currencyCode: 'INR',
      dueDayOfMonth: 5,
      autoLateFee: true,
      lateFeeDays: 10,
      lateFeeFixed: 100,
      supabaseUrl: 'https://xyzcompany.supabase.co',
      supabaseConnected: true,
    };

    const initialCustomFields = [
      { id: 'cf-1', name: 'emergencyContact', label: 'Emergency Phone', type: 'text', entityType: 'member' },
      { id: 'cf-2', name: 'lockerNumber', label: 'Locker #', type: 'text', entityType: 'member' },
      { id: 'cf-3', name: 'sportActivity', label: 'Primary Activity', type: 'select', entityType: 'member', options: ['Tennis', 'Badminton', 'Swimming', 'Gym & Fitness', 'Golf', 'Chess & Cards'] },
      { id: 'cf-4', name: 'eventSponsorTier', label: 'Sponsorship Level', type: 'select', entityType: 'earning', options: ['Platinum Title', 'Gold Partner', 'Silver Sponsor', 'Patron Support'] }
    ];

    const initialPlans = [
      { id: 'plan-standard', name: 'Standard Club Plan', fee: 500, billingCycle: 'monthly', description: 'Full access to general club facilities, lounge, and community events.', color: '#3b82f6', active: true, lateFeeDays: 10, lateFeeAmount: 50 },
      { id: 'plan-premium', name: 'Premium Sports & Gym', fee: 1000, billingCycle: 'monthly', description: 'All Standard perks plus fitness gym, sports coaching, sauna, and grounds.', color: '#8b5cf6', active: true, lateFeeDays: 10, lateFeeAmount: 100 },
      { id: 'plan-vip', name: 'VIP Executive Plan', fee: 2500, billingCycle: 'monthly', description: 'Executive lounge, priority ground bookings, free guest passes & lockers.', color: '#f59e0b', active: true, lateFeeDays: 10, lateFeeAmount: 200 },
      { id: 'plan-student', name: 'Student & Youth Athlete', fee: 300, billingCycle: 'monthly', description: 'Discounted membership for youth athletes & students with club training.', color: '#10b981', active: true, lateFeeDays: 10, lateFeeAmount: 25 },
    ];

    const initialMembers = [];

    const initialPayments = [];

    
    // Add Earning Dialog Component
    function AddEarningDialog({ onAddEarning, customFields, onClose }) {
      const [formData, setFormData] = useState({
        title: '',
        category: 'tournament',
        amount: '',
        date: new Date().toISOString().split('T')[0],
        paymentMethod: 'cash',
        payerOrCustomer: '',
        referenceNo: 'REC-' + Date.now().toString().slice(-6),
        description: '',
        customFields: {}
      });

      const earningCategories = [
        { id: 'tournament', label: '🏆 Tournament & Entry Fees' },
        { id: 'sponsorship', label: '🤝 Corporate Sponsorship & Banner' },
        { id: 'canteen_bar', label: '☕ Clubhouse Canteen & Sports Bar' },
        { id: 'merchandise', label: '👕 Club Jersey & Merch Sales' },
        { id: 'events', label: '🎉 Club Annual Gala & Ticket Sales' },
        { id: 'guest_fees', label: '🎟️ Ground & Court Booking / Day Passes' },
        { id: 'donations', label: '💖 Patron Grant & Public Donation' },
        { id: 'other', label: '📦 Other Miscellaneous Earning' }
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) {
          alert('Please enter an Earning Title');
          return;
        }
        if (!formData.amount || Number(formData.amount) <= 0) {
          alert('Please enter a valid amount in ₹ INR');
          return;
        }
        onAddEarning({
          ...formData,
          id: 'earn-' + Date.now(),
          amount: Number(formData.amount)
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl animate-in fade-in zoom-in duration-200">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="trending-up" className="w-5 h-5 text-emerald-400"></i>
                <span>💰 Log New Club Earning</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 max-h-[75vh] overflow-y-auto pr-1">
              <div>
                <label className="block text-xs text-slate-300 font-semibold mb-1">Earning Title *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Cricket Tournament Entry Fees / Banner Sponsorship"
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white font-medium text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Amount (₹ INR) *</label>
                  <div className="relative">
                    <span className="absolute left-3 top-2 text-emerald-400 font-bold text-base">₹</span>
                    <input
                      type="number"
                      min="1"
                      step="1"
                      required
                      placeholder="5000"
                      value={formData.amount}
                      onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                      className="w-full pl-8 pr-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-emerald-400 font-extrabold text-base focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Category *</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  >
                    {earningCategories.map(c => (
                      <option key={c.id} value={c.id}>{c.label}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Payment Method</label>
                  <select
                    value={formData.paymentMethod}
                    onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  >
                    <option value="cash">💵 Cash at Reception</option>
                    <option value="upi">📱 UPI / QR Code</option>
                    <option value="card">💳 Card / POS</option>
                    <option value="bank_transfer">🏦 Bank Transfer / NEFT</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Date Received</label>
                  <input
                    type="date"
                    required
                    value={formData.date}
                    onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Received From / Payer</label>
                  <input
                    type="text"
                    placeholder="e.g. XYZ Sports Agency / John"
                    value={formData.payerOrCustomer}
                    onChange={(e) => setFormData({ ...formData, payerOrCustomer: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs"
                  />
                </div>

                <div>
                  <label className="block text-xs text-slate-300 font-semibold mb-1">Invoice / Reference #</label>
                  <input
                    type="text"
                    placeholder="e.g. REC-10294"
                    value={formData.referenceNo}
                    onChange={(e) => setFormData({ ...formData, referenceNo: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs font-mono"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs text-slate-300 font-semibold mb-1">Notes / Description</label>
                <textarea
                  rows="2"
                  placeholder="Additional details regarding this income..."
                  value={formData.description}
                  onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs shadow-lg shadow-emerald-600/30 flex items-center gap-1.5"
                >
                  <i data-lucide="check" className="w-3.5 h-3.5"></i>
                  <span>Save Earning</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {

      // Auto-migrate plans and settings to Indian Rupee (INR)
      try {
        const savedSettings = localStorage.getItem('fp_settings');
        if (savedSettings && savedSettings.includes('$')) {
          localStorage.removeItem('fp_settings');
          localStorage.removeItem('fp_plans');
        }
      } catch(e) {}
    

      // Auto-cleanup old mock members from previous session
      try {
        const storedMem = localStorage.getItem('fp_members');
        if (storedMem && storedMem.includes('Alexander Wright')) {
          localStorage.removeItem('fp_members');
          localStorage.removeItem('fp_payments');
        }
      } catch(e) {}
    
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('fp_current_user');
        return saved ? JSON.parse(saved) : initialStaffUsers[0];
      });

      const [staffUsers, setStaffUsers] = useState(() => {
        const saved = localStorage.getItem('fp_staff_users');
        return saved ? JSON.parse(saved) : initialStaffUsers;
      });

      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [tab, setTab] = useState('dashboard');
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('fp_members') || '[]'));
      const [plans, setPlans] = useState(() => JSON.parse(localStorage.getItem('fp_plans') || JSON.stringify(initialPlans)));
      const [payments, setPayments] = useState(() => JSON.parse(localStorage.getItem('fp_payments') || '[]'));
      const [earnings, setEarnings] = useState(() => JSON.parse(localStorage.getItem('fp_earnings') || JSON.stringify(initialEarnings)));
      const [customFields, setCustomFields] = useState(() => JSON.parse(localStorage.getItem('fp_custom_fields') || JSON.stringify(initialCustomFields)));
      const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('fp_settings') || JSON.stringify(initialSettings)));
      const [selectedMonth, setSelectedMonth] = useState('2026-08');

      // Modals
      const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
      const [isAddEarningOpen, setIsAddEarningOpen] = useState(false);
      const [activeReceipt, setActiveReceipt] = useState(null);
      const [isAddStaffOpen, setIsAddStaffOpen] = useState(false);
      const [justAuthorizedStaff, setJustAuthorizedStaff] = useState(null);

      // Persistence
      useEffect(() => { localStorage.setItem('fp_current_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('fp_staff_users', JSON.stringify(staffUsers)); }, [staffUsers]);

      // Live Supabase Sync on Startup
      useEffect(() => {
        if (!supabase) return;

        const loadFromSupabase = async () => {
          try {
            // 1. Fetch Plans
            const { data: dbPlans, error: errPlans } = await supabase.from('membership_plans').select('*').order('created_at', { ascending: true });
            if (!errPlans && dbPlans && dbPlans.length > 0) {
              const formattedPlans = dbPlans.map(p => ({
                id: p.id,
                name: p.name,
                fee: Number(p.fee) || 0,
                billingCycle: p.billing_cycle || 'monthly',
                description: p.description || '',
                color: p.color || '#3b82f6',
                active: p.active !== false,
                lateFeeDays: p.late_fee_days || 10,
                lateFeeAmount: Number(p.late_fee_amount) || 50
              }));
              setPlans(formattedPlans);
            }

            // 2. Fetch Members
            const { data: dbMembers, error: errMem } = await supabase.from('members').select('*').order('created_at', { ascending: false });
            if (!errMem && dbMembers) {
              const formattedMembers = dbMembers.map(m => ({
                id: m.id,
                name: m.name,
                email: m.email || '',
                phone: m.phone || '',
                planId: m.plan_id,
                role: m.role || 'Member',
                customFee: m.custom_fee !== null ? Number(m.custom_fee) : null,
                joinDate: m.join_date || new Date().toISOString().split('T')[0],
                status: m.status || 'active',
                notes: m.notes || '',
                customFields: m.custom_fields || {}
              }));
              setMembers(formattedMembers);
            }

            // 3. Fetch Payments
            const { data: dbPayments, error: errPay } = await supabase.from('payment_records').select('*');
            if (!errPay && dbPayments) {
              const formattedPayments = dbPayments.map(p => ({
                id: p.id,
                memberId: p.member_id,
                planId: p.plan_id,
                monthYear: p.month_year,
                amount: Number(p.amount) || 0,
                paidAmount: Number(p.paid_amount) || 0,
                status: p.status || 'pending',
                paymentMethod: p.payment_method || 'cash',
                paidAt: p.paid_at,
                invoiceNo: p.invoice_no,
                notes: p.notes
              }));
              setPayments(formattedPayments);
            }

            // 4. Fetch Earnings
            const { data: dbEarnings, error: errEarn } = await supabase.from('club_earnings').select('*').order('date', { ascending: false });
            if (!errEarn && dbEarnings) {
              const formattedEarnings = dbEarnings.map(e => ({
                id: e.id,
                title: e.title,
                category: e.category,
                amount: Number(e.amount) || 0,
                date: e.date,
                paymentMethod: e.payment_method,
                payerOrCustomer: e.payer_or_customer,
                referenceNo: e.reference_no,
                description: e.description,
                customFields: e.custom_fields || {}
              }));
              setEarnings(formattedEarnings);
            }
          } catch (e) {
            console.warn('Supabase sync notice:', e);
          }
        };

        loadFromSupabase();
      }, []);

      // Auto-save Members to Supabase
      useEffect(() => {
        localStorage.setItem('fp_members', JSON.stringify(members));
        if (supabase && members.length > 0) {
          const payload = members.map(m => ({
            id: m.id,
            name: m.name,
            email: m.email,
            phone: m.phone,
            plan_id: m.planId,
            role: m.role,
            custom_fee: m.customFee,
            join_date: m.joinDate,
            status: m.status,
            notes: m.notes,
            custom_fields: m.customFields || {}
          }));
          supabase.from('members').upsert(payload).then(() => {});
        }
      }, [members]);

      // Auto-save Plans to Supabase
      useEffect(() => {
        localStorage.setItem('fp_plans', JSON.stringify(plans));
        if (supabase && plans.length > 0) {
          const payload = plans.map(p => ({
            id: p.id,
            name: p.name,
            fee: p.fee,
            billing_cycle: p.billingCycle,
            description: p.description,
            color: p.color,
            active: p.active,
            late_fee_days: p.lateFeeDays,
            late_fee_amount: p.lateFeeAmount
          }));
          supabase.from('membership_plans').upsert(payload).then(() => {});
        }
      }, [plans]);

      // Auto-save Payments to Supabase
      useEffect(() => {
        localStorage.setItem('fp_payments', JSON.stringify(payments));
        if (supabase && payments.length > 0) {
          const payload = payments.map(p => ({
            id: p.id,
            member_id: p.memberId,
            plan_id: p.planId,
            month_year: p.monthYear,
            amount: p.amount,
            paid_amount: p.paidAmount,
            status: p.status,
            payment_method: p.paymentMethod,
            paid_at: p.paidAt,
            invoice_no: p.invoiceNo,
            notes: p.notes
          }));
          supabase.from('payment_records').upsert(payload).then(() => {});
        }
      }, [payments]);

      // Auto-save Earnings to Supabase
      useEffect(() => {
        localStorage.setItem('fp_earnings', JSON.stringify(earnings));
        if (supabase && earnings.length > 0) {
          const payload = earnings.map(e => ({
            id: e.id,
            title: e.title,
            category: e.category,
            amount: e.amount,
            date: e.date,
            payment_method: e.paymentMethod,
            payer_or_customer: e.payerOrCustomer,
            reference_no: e.referenceNo,
            description: e.description,
            custom_fields: e.customFields || {}
          }));
          supabase.from('club_earnings').upsert(payload).then(() => {});
        }
      }, [earnings]);

      useEffect(() => { localStorage.setItem('fp_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('fp_custom_fields', JSON.stringify(customFields)); }, [customFields]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const formatCurrency = (val) => {
        return '₹' + Number(val || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      };

      const getMemberEffectiveFee = (member) => {
        if (member.customFee !== undefined && member.customFee !== null && member.customFee >= 0) return member.customFee;
        const plan = plans.find(p => p.id === member.planId);
        return plan ? plan.fee : 0;
      };

      const quickPayMember = (memberId, mStr, method = 'card') => {
        const member = members.find(m => m.id === memberId);
        if (!member) return;
        const fee = getMemberEffectiveFee(member);
        const existing = payments.find(p => p.memberId === memberId && p.monthYear === mStr);
        if (existing) {
          setPayments(prev => prev.map(p => p.id === existing.id ? { ...p, status: 'paid', paidAmount: p.amount, paymentMethod: method, paidAt: new Date().toISOString() } : p));
        } else {
          const newPay = {
            id: 'pay-' + mStr + '-' + memberId,
            memberId,
            planId: member.planId,
            monthYear: mStr,
            amount: fee,
            paidAmount: fee,
            status: 'paid',
            paymentMethod: method,
            paidAt: new Date().toISOString(),
            invoiceNo: 'INV-' + mStr.replace('-', '') + '-' + Math.floor(1000 + Math.random() * 9000),
          };
          setPayments(prev => [newPay, ...prev]);
        }
      };

      const resetData = () => {
        setMembers(initialMembers);
        setPlans(initialPlans);
        setPayments(initialPayments);
        setEarnings(initialEarnings);
        setCustomFields(initialCustomFields);
        setSettings(initialSettings);
        setStaffUsers(initialStaffUsers);
        setCurrentUser(initialStaffUsers[0]);
        setSelectedMonth('2026-08');
      };

      const handleLoginAs = (staff) => {
        setCurrentUser(staff);
        setIsLoggedIn(true);
      };

      const handleLaunchStaffPortal = (staff) => {
        setCurrentUser(staff);
        setIsLoggedIn(true);
        setTab('dashboard');
        setJustAuthorizedStaff(null);
      };

      const activeMembers = members.filter(m => m.status === 'active');
      const monthPayments = payments.filter(p => p.monthYear === selectedMonth);
      const monthlyFeesExpected = activeMembers.reduce((sum, m) => {
        const p = monthPayments.find(pay => pay.memberId === m.id);
        const plan = plans.find(pl => pl.id === m.planId);
        return sum + (p ? p.amount : (m.customFee ?? (plan?.fee || 0)));
      }, 0);
      const monthlyFeesCollected = monthPayments.filter(p => p.status === 'paid').reduce((sum, p) => sum + p.paidAmount, 0);
      const monthlyFeesPending = monthPayments.filter(p => p.status === 'pending' || p.status === 'overdue').reduce((sum, p) => sum + (p.amount - p.paidAmount), 0);
      const allPaidFees = payments.filter(p => p.status === 'paid').reduce((sum, p) => sum + p.paidAmount, 0);
      const totalOtherEarnings = earnings.reduce((sum, e) => sum + e.amount, 0);
      const totalClubRevenue = allPaidFees + totalOtherEarnings;
      const collectionRate = monthlyFeesExpected > 0 ? Math.round((monthlyFeesCollected / monthlyFeesExpected) * 100) : 0;
      const overdueCount = monthPayments.filter(p => p.status === 'overdue').length;
      const pendingCount = monthPayments.filter(p => p.status === 'pending').length;

      if (!isLoggedIn) {
        return (
          <LoginScreen
            staffUsers={staffUsers}
            settings={settings}
            onLogin={handleLoginAs}
          />
        );
      }

      return (

        return sum + (p ? p.amount : (m.customFee ?? (plan?.fee || 0)));
      }, 0);
      const monthlyFeesCollected = monthPayments.filter(p => p.status === 'paid').reduce((sum, p) => sum + p.paidAmount, 0);
      const monthlyFeesPending = monthPayments.filter(p => p.status === 'pending' || p.status === 'overdue').reduce((sum, p) => sum + (p.amount - p.paidAmount), 0);
      const allPaidFees = payments.filter(p => p.status === 'paid').reduce((sum, p) => sum + p.paidAmount, 0);
      const totalOtherEarnings = earnings.reduce((sum, e) => sum + e.amount, 0);
      const totalClubRevenue = allPaidFees + totalOtherEarnings;
      const collectionRate = monthlyFeesExpected > 0 ? Math.round((monthlyFeesCollected / monthlyFeesExpected) * 100) : 0;
      const overdueCount = monthPayments.filter(p => p.status === 'overdue').length;

    // Monthly Checklist Component
    function ChecklistView({ members, plans, payments, setPayments, selectedMonth, setSelectedMonth, formatCurrency, getMemberEffectiveFee, onOpenReceipt }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const activeMembers = members.filter(m => m.status === 'active');
      const monthPayments = payments.filter(p => p.monthYear === selectedMonth);

      const filtered = activeMembers.filter(m => {
        const matchesSearch = m.name.toLowerCase().includes(searchTerm.toLowerCase()) || m.email.toLowerCase().includes(searchTerm.toLowerCase()) || (m.role && m.role.toLowerCase().includes(searchTerm.toLowerCase()));
        const pay = monthPayments.find(p => p.memberId === m.id);
        const status = pay?.status || 'pending';
        const matchesStatus = statusFilter === 'all' || status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      const markStatus = (payId, memberId, newStatus, method = 'card') => {
        setPayments(prev => {
          const idx = prev.findIndex(p => p.id === payId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = {
              ...copy[idx],
              status: newStatus,
              paidAmount: newStatus === 'paid' ? copy[idx].amount : 0,
              paymentMethod: newStatus === 'paid' ? method : copy[idx].paymentMethod,
              paidAt: newStatus === 'paid' ? new Date().toISOString() : undefined,
            };
            return copy;
          } else {
            const member = members.find(m => m.id === memberId);
            const fee = getMemberEffectiveFee(member);
            return [{
              id: 'pay-' + selectedMonth + '-' + memberId,
              memberId,
              planId: member.planId,
              monthYear: selectedMonth,
              amount: fee,
              paidAmount: newStatus === 'paid' ? fee : 0,
              status: newStatus,
              paymentMethod: method,
              paidAt: newStatus === 'paid' ? new Date().toISOString() : undefined,
              invoiceNo: 'INV-' + selectedMonth.replace('-', '') + '-' + Math.floor(1000 + Math.random() * 9000),
            }, ...prev];
          }
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-white flex items-center gap-2.5">
                <i data-lucide="check-square" className="w-6 h-6 text-indigo-400"></i>
                <span>Monthly Club Membership Fee Checklist</span>
              </h1>
              <p className="text-slate-400 text-sm mt-1">Track payments, issue receipts, and manage monthly dues for all club members.</p>
            </div>
            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-300 font-semibold">Month:</span>
              <select
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-1.5 text-sm font-bold"
              >
                <option value="2026-08">August 2026</option>
                <option value="2026-07">July 2026</option>
                <option value="2026-06">June 2026</option>
              </select>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900/80 p-4 rounded-xl border border-slate-800">
            <input
              type="text"
              placeholder="Search member or role..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full sm:w-64 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none"
            />
            <div className="flex space-x-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs">
              {['all', 'paid', 'pending', 'overdue'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  className={'px-3 py-1 rounded-md font-semibold capitalize ' + (statusFilter === st ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200')}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-800/80 text-xs uppercase text-slate-400">
                <tr>
                  <th className="p-4">Member Name</th>
                  <th className="p-4">Member Role</th>
                  <th className="p-4">Plan</th>
                  <th className="p-4">Monthly Fee</th>
                  <th className="p-4">Status</th>
                  <th className="p-4">Payment Method</th>
                  <th className="p-4">Invoice No</th>
                  <th className="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map(member => {
                  const plan = plans.find(p => p.id === member.planId);
                  const pay = monthPayments.find(p => p.memberId === member.id);
                  const fee = member.customFee ?? (plan?.fee || 0);
                  const isPaid = pay?.status === 'paid';
                  const isOverdue = pay?.status === 'overdue';

                  return (
                    <tr key={member.id} className="hover:bg-slate-800/40">
                      <td className="p-4 font-bold text-white">
                        <div>{member.name}</div>
                        <div className="text-xs text-slate-400 font-normal">{member.email}</div>
                      </td>
                      <td className="p-4">
                        <span className={'px-2.5 py-0.5 text-xs font-extrabold uppercase rounded-full ' + (
                          member.role === 'Finance'
                            ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
                            : member.role === 'Executive Member'
                            ? 'bg-purple-500/20 text-purple-400 border border-purple-500/40'
                            : 'bg-slate-800 text-slate-300 border border-slate-700'
                        )}>
                          {member.role || 'Member'}
                        </span>
                      </td>
                      <td className="p-4">
                        <span className="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                          {plan?.name || 'Standard'}
                        </span>
                      </td>
                      <td className="p-4 font-extrabold text-white">
                        {formatCurrency(fee)}
                        {member.customFee !== undefined && <span className="text-[10px] text-amber-400 block font-normal">(Custom Rate)</span>}
                      </td>
                      <td className="p-4">
                        {isPaid ? (
                          <span className="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Paid</span>
                        ) : isOverdue ? (
                          <span className="px-2.5 py-1 text-xs font-bold rounded-full bg-red-500/20 text-red-400 border border-red-500/30">Overdue</span>
                        ) : (
                          <span className="px-2.5 py-1 text-xs font-bold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Pending</span>
                        )}
                      </td>
                      <td className="p-4 text-xs font-semibold text-slate-300 uppercase">
                        {isPaid ? (pay?.paymentMethod || 'CARD') : '—'}
                      </td>
                      <td className="p-4 font-mono text-xs text-indigo-300">
                        {pay?.invoiceNo || 'INV-PENDING'}
                      </td>
                      <td className="p-4 text-right space-x-2">
                        {isPaid ? (
                          <>
                            <button
                              onClick={() => onOpenReceipt(pay, member)}
                              className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg"
                            >
                              Receipt
                            </button>
                            <button
                              onClick={() => markStatus(pay.id, member.id, 'pending')}
                              className="text-xs text-slate-400 hover:text-amber-400 underline"
                            >
                              Undo
                            </button>
                          </>
                        ) : (
                          <button
                            onClick={() => markStatus(pay ? pay.id : '', member.id, 'paid', 'card')}
                            className="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold shadow"
                          >
                            Mark Paid
                          </button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

        lateFeeDays: 10,
        lateFeeAmount: 50
      });

      const openAddModal = () => {
        setIsAddingNew(true);
        setEditingPlan(null);
        setPlanForm({
          id: 'plan-' + Date.now(),
          name: '',
          fee: 500,
          billingCycle: 'monthly',
          description: '',
          color: '#3b82f6',
          lateFeeDays: 10,
          lateFeeAmount: 50
        });
      };

      const openEditModal = (p) => {
        setIsAddingNew(false);
        setEditingPlan(p);
        setPlanForm({ ...p });
      };

      const handleSavePlan = (e) => {
        e.preventDefault();
        if (!planForm.name.trim()) {
          alert('Please enter a Plan Name');
          return;
        }
        if (isAddingNew) {
          setPlans(prev => [...prev, { ...planForm, fee: Number(planForm.fee) || 0, lateFeeDays: Number(planForm.lateFeeDays) || 10, lateFeeAmount: Number(planForm.lateFeeAmount) || 0, active: true }]);
        } else {
          setPlans(prev => prev.map(p => p.id === planForm.id ? { ...planForm, fee: Number(planForm.fee) || 0, lateFeeDays: Number(planForm.lateFeeDays) || 10, lateFeeAmount: Number(planForm.lateFeeAmount) || 0 } : p));
        }
        setEditingPlan(null);
        setIsAddingNew(false);
      };

      const handleDeletePlan = (planId, planName) => {
        const enrolled = members.filter(m => m.planId === planId && m.status === 'active').length;
        if (enrolled > 0) {
          alert(`Cannot delete "${planName}" because it currently has ${enrolled} active member(s) enrolled. Please switch their plan first.`);
          return;

          setPlans(prev => prev.filter(p => p.id !== planId));

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">

              const count = members.filter(m => m.planId === plan.id && m.status === 'active').length;

                <div key={plan.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between relative overflow-hidden group hover:border-slate-700 transition">

                    </td>
                    <td className="p-4">
                      <span className="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 capitalize">
                        {earn.category.replace('_', ' ')}
                      </span>
                    </td>
                    <td className="p-4 text-xs text-slate-300">{earn.date}</td>
                    <td className="p-4 text-xs text-slate-300">{earn.payerOrCustomer || 'Direct'}</td>
                    <td className="p-4 font-extrabold text-emerald-400 text-base">+{formatCurrency(earn.amount)}</td>
                    <td className="p-4 text-right">
                      <button
                        onClick={() => {
                          if (confirm('Delete ' + earn.title + '?')) {
                            setEarnings(prev => prev.filter(e => e.id !== earn.id));
                          }
                        }}
                        className="text-red-400 hover:text-red-300 text-xs font-semibold"
                      >
                        Delete
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Custom Fields View
    function CustomFieldsView({ customFields, setCustomFields }) {
      const [label, setLabel] = useState('');
      const [type, setType] = useState('text');
      const [entityType, setEntityType] = useState('member');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!label.trim()) return;
        const id = 'cf-' + Date.now();
        const name = label.toLowerCase().replace(/[^a-z0-9]/g, '');
        setCustomFields(prev => [...prev, { id, name, label: label.trim(), type, entityType }]);
        setLabel('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h1 className="text-2xl font-extrabold text-white flex items-center gap-2.5">
              <i data-lucide="layers" className="w-6 h-6 text-indigo-400"></i>
              <span>Dynamic Custom Fields Builder</span>
            </h1>
            <p className="text-slate-400 text-sm mt-1">Add custom fields to member profiles (e.g. Locker #, Emergency Contacts) or club earnings.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <form onSubmit={handleAdd} className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4 text-xs h-fit">
              <h2 className="text-lg font-bold text-white">Add New Custom Field</h2>
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Field Label</label>
                <input
                  type="text"
                  placeholder="e.g. Locker Number, Shirt Size"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white"
                  required
                />
              </div>
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Attach To</label>
                <select
                  value={entityType}
                  onChange={(e) => setEntityType(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white"
                >
                  <option value="member">Member Profiles</option>
                  <option value="earning">Commercial Earnings</option>
                </select>
              </div>
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Field Type</label>
                <select
                  value={type}
                  onChange={(e) => setType(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white"
                >
                  <option value="text">Text String</option>
                  <option value="number">Number</option>
                  <option value="date">Date</option>
                </select>
              </div>
              <button type="submit" className="w-full py-2 bg-indigo-600 text-white font-bold rounded-lg shadow">
                Create Field
              </button>
            </form>

            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-3">
              <h2 className="text-lg font-bold text-white mb-2">Configured Custom Fields</h2>
              {customFields.map(cf => (
                <div key={cf.id} className="p-3.5 bg-slate-800/60 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                  <div>
                    <span className="font-bold text-white text-sm mr-2">{cf.label}</span>
                    <span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded uppercase font-semibold text-[10px] mr-1">{cf.entityType}</span>
                    <span className="px-2 py-0.5 bg-slate-700 text-slate-300 rounded text-[10px] capitalize">{cf.type}</span>
                  </div>
                  <button
                    onClick={() => setCustomFields(prev => prev.filter(c => c.id !== cf.id))}
                    className="text-red-400 hover:text-red-300 font-semibold"
                  >
                    Remove
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Settings Tab & Supabase SQL Schema Viewer
    function SettingsTab({ settings, setSettings, resetData }) {
      const [clubName, setClubName] = useState(settings.clubName);
      const [tagline, setTagline] = useState(settings.tagline);
      const [currencySymbol, setCurrencySymbol] = useState(settings.currencySymbol);
      const [supabaseUrl, setSupabaseUrl] = useState(settings.supabaseUrl || 'https://xyzcompany.supabase.co');

      const handleSave = (e) => {
        e.preventDefault();
        setSettings({ ...settings, clubName, tagline, currencySymbol, supabaseUrl });
        alert('Settings & Supabase configuration saved!');
      };

      return (
        <div className="max-w-3xl space-y-6">
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h1 className="text-2xl font-extrabold text-white flex items-center gap-2.5">
              <i data-lucide="settings" className="w-6 h-6 text-indigo-400"></i>
              <span>Portal Settings & Supabase SQL Integration</span>
            </h1>
            <p className="text-slate-400 text-sm mt-1">Configure club identity, currency, and Supabase database authorization.</p>
          </div>

          <div className="bg-slate-900 border border-emerald-500/40 p-5 rounded-2xl shadow-xl space-y-3">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <h3 className="font-bold text-white text-base">Supabase Database Integration</h3>
              </div>
              <span className="text-xs px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full font-bold">
                RLS & Role: Finance Ready
              </span>
            </div>
            <p className="text-xs text-slate-300">
              The database schema file <code className="text-emerald-300 font-mono">supabase_schema.sql</code> has been updated with the complete table creation order and Row Level Security (RLS) policies for the <strong>Finance</strong> role.
            </p>
          </div>

          <form onSubmit={handleSave} className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4 text-xs">
            <div>
              <label className="block text-slate-300 font-semibold mb-1">Club Name</label>
              <input
                type="text"
                value={clubName}
                onChange={(e) => setClubName(e.target.value)}
                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white font-bold text-sm"
                required
              />
            </div>
            <div>
              <label className="block text-slate-300 font-semibold mb-1">Tagline</label>
              <input
                type="text"
                value={tagline}
                onChange={(e) => setTagline(e.target.value)}
                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white"
              />
            </div>
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Currency Symbol</label>
                <input
                  type="text"
                  value={currencySymbol}
                  onChange={(e) => setCurrencySymbol(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white font-bold"
                  required
                />
              </div>
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Supabase Project URL</label>
                <input
                  type="text"
                  value={supabaseUrl}
                  onChange={(e) => setSupabaseUrl(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white font-mono"
                />
              </div>
            </div>
            <div className="flex justify-between items-center pt-3 border-t border-slate-800">
              <button type="button" onClick={resetData} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-semibold">
                Reset Demo Data
              </button>
              <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow">
                Save Settings
              </button>
            </div>
          </form>
        </div>
      );
    }

    // Receipt Dialog
    function ReceiptDialog({ payment, member, settings, plans, formatCurrency, onClose }) {
      const plan = plans.find(p => p.id === member.planId);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3 no-print">
              <span className="text-xs font-bold text-slate-400 uppercase">Payment Receipt</span>
              <div className="space-x-2">
                <button onClick={() => window.print()} className="px-3 py-1 bg-indigo-600 text-white rounded text-xs font-bold">Print</button>
                <button onClick={onClose} className="text-slate-400 hover:text-white px-2">✕</button>
              </div>
            </div>

            <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-4">
              <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                <div>
                  <h2 className="text-lg font-bold text-white">{settings.clubName}</h2>
                  <p className="text-xs text-slate-400">{settings.tagline}</p>
                </div>
                <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded">PAID</span>
              </div>

              <div className="text-xs space-y-1">
                <div><span className="text-slate-400">Billed To:</span> <span className="font-bold text-white">{member.name}</span> <span className="text-emerald-400 font-bold">({member.role || 'Member'})</span></div>
                <div><span className="text-slate-400">Email:</span> {member.email}</div>
                <div><span className="text-slate-400">Invoice:</span> <span className="font-mono text-indigo-300">{payment.invoiceNo}</span></div>
                <div><span className="text-slate-400">Month:</span> {payment.monthYear} ({plan?.name || 'Standard'})</div>
              </div>

              <div className="flex justify-between items-center pt-3 border-t border-slate-800 text-sm">
                <span className="font-bold text-white">Total Paid:</span>
                <span className="text-lg font-extrabold text-emerald-400">{formatCurrency(payment.paidAmount || payment.amount)}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
